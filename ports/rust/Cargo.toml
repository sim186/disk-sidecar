[package]
name = "sidecar-scan"
version = "0.9.0"
edition = "2021"
publish = false

[[bin]]
name = "sidecar-scan-rs"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
libc = "0.2"
getrandom = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
