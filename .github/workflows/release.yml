name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./build.sh
      - name: Package
        run: |
          cd dist
          rm -f sidecar
          zip "../disk-sidecar-${GITHUB_REF_NAME}-all-systems.zip" sidecar-*
          sha256sum sidecar-* > ../SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/sidecar-* "disk-sidecar-${GITHUB_REF_NAME}-all-systems.zip" SHA256SUMS --generate-notes --title "Disk Sidecar ${GITHUB_REF_NAME#v}"
